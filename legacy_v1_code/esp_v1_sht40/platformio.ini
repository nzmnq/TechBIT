; TechBIT PlatformIO Configuration — Wheel Nodes (ESP32-C3 SuperMini) + Central Hub (ESP32-S3)
; Wheel Node Hardware: ESP32-C3 SuperMini + MCP6002 (GPIO2) + GY-SHT40 (GPIO8/GPIO9, 0x44) + SN65HVD230 (GPIO21/GPIO20)
; Central Hub Hardware: ESP32-S3 + SN65HVD230 (GPIO4/GPIO5, avoiding USB D-/D+ GPIO19/20) + BOOT (GPIO0)

[platformio]
default_envs = wheel_fl

[env]
lib_ldf_mode = deep+
build_flags =
    -I include

[esp32c3_base]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -I include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ENABLE_SHT40=1
    -D ENABLE_WIFI_TELEMETRY=1
    ; Optional: uncomment and set your Wi-Fi + PC server URL for wireless web telemetry
    ; -D TECHBIT_WIFI_SSID=\"YourWiFi\"
    ; -D TECHBIT_WIFI_PASS=\"YourPass\"
    ; -D TECHBIT_WEB_URL=\"http://192.168.1.100:5050/api/telemetry\"

[wheel_base]
extends = esp32c3_base
build_src_filter = +<wheel_node/> -<central_hub/>
build_flags =
    ${esp32c3_base.build_flags}
    -D TECHBIT_ROLE_WHEEL=1
    -D TECHBIT_SERIAL_DEFAULT_JSON=1

[env:wheel_fl]
extends = wheel_base
build_flags =
    ${wheel_base.build_flags}
    -D WHEEL_NODE_ID=0

[env:wheel_fr]
extends = wheel_base
build_flags =
    ${wheel_base.build_flags}
    -D WHEEL_NODE_ID=1

[env:wheel_rl]
extends = wheel_base
build_flags =
    ${wheel_base.build_flags}
    -D WHEEL_NODE_ID=2

[env:wheel_rr]
extends = wheel_base
build_flags =
    ${wheel_base.build_flags}
    -D WHEEL_NODE_ID=3

[env:central_hub]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_src_filter = +<central_hub/> -<wheel_node/>
build_flags =
    -I include
    -D TECHBIT_ROLE_CENTRAL=1
    -D ENABLE_WIFI_TELEMETRY=1
    -D TECHBIT_SERIAL_DEFAULT_JSON=0

[env:native_test]
platform = native
build_flags =
    -I include
    -std=gnu++17
lib_deps =
    throwtheswitch/Unity@^2.6.0
lib_ignore =
    TechBitCAN
