; ============================================================================
; TechBIT MVP v2.0 — B2B Truck & Trailer Wheel Diagnostics Firmware
; PlatformIO Multi-Role Configuration:
;   - c3_node           : Unified ESP32-C3 Axle Node (Tractor Front/Rear, Trailer 1..3)
;   - c3_trailer_bridge : ESP32-C3 Trailer Wireless Gateway (CAN -> ESP-NOW LR AES-128)
;   - s3_master         : ESP32-S3 Cabin Master, Black Box, LTE, Mini LED & Service BLE
;   - native_test       : Host Unity unit tests (DSP, CAN v2, ESP-NOW, Rules, BlackBox)
; ============================================================================

[platformio]
default_envs = c3_node, c3_trailer_bridge, s3_master

[env]
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -Iinclude

[esp_base]
platform = espressif32@^6.9.0
framework = arduino
build_flags =
    ${env.build_flags}

; ----------------------------------------------------------------------------
; Role 1: Unified Axle Node (ESP32-C3 SuperMini / Custom 24V Axle PCB)
; Reads L+R Wheel Vibration & Temperature on ADC1, runs Edge DSP, sends Extended CAN
; ----------------------------------------------------------------------------
[env:c3_node]
extends = esp_base
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
build_src_filter = +<c3_node/> -<c3_trailer_bridge/> -<s3_master/>
lib_ignore = TechBitRules
build_flags =
    ${esp_base.build_flags}
    -D TECHBIT_ROLE_C3_NODE=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ----------------------------------------------------------------------------
; Role 2: Trailer Wireless Gateway (ESP32-C3 Front Wall of Trailer)
; Aggregates Trailer CAN bus -> forwards to S3 Master via ESP-NOW LR AES-128
; ----------------------------------------------------------------------------
[env:c3_trailer_bridge]
extends = esp_base
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
build_src_filter = +<c3_trailer_bridge/> -<c3_node/> -<s3_master/>
lib_ignore = TechBitDSP, TechBitRules
build_flags =
    ${esp_base.build_flags}
    -D TECHBIT_ROLE_C3_BRIDGE=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ----------------------------------------------------------------------------
; Role 3: Cabin Master, Black Box, LTE Gateway & Service BLE (ESP32-S3)
; Pure digital hub (NO direct analog wheel sensors on S3)
; ----------------------------------------------------------------------------
[env:s3_master]
extends = esp_base
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
build_src_filter = +<s3_master/> -<c3_node/> -<c3_trailer_bridge/>
lib_ignore = TechBitDSP
build_flags =
    ${esp_base.build_flags}
    -D TECHBIT_ROLE_S3_MASTER=1

; ----------------------------------------------------------------------------
; Host Unit Tests (Native C++17 — runs on Windows/Linux without hardware)
; Run via: pio test -e native_test
; ----------------------------------------------------------------------------
[env:native_test]
platform = native
lib_compat_mode = off
lib_ldf_mode = deep+
lib_deps =
    TechBitDSP
    TechBitRules
build_src_filter = -<*>
lib_ignore = TechBitCAN
build_flags =
    ${env.build_flags}
