; ============================================================================
; TechBIT Automotive Wheel Vibration & Brake Monitoring System
; PlatformIO Multi-Target Configuration (ESP32-C3 Wheel Nodes + ESP32-S3 Hub)
; ============================================================================

[platformio]
default_envs = central_hub, wheel_fl

[env]
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -Iinclude

; ----------------------------------------------------------------------------
; Base configuration for all ESP32 nodes
; ----------------------------------------------------------------------------
[esp_base]
platform = espressif32@^6.9.0
framework = arduino
build_flags =
    ${env.build_flags}

; ----------------------------------------------------------------------------
; Shared settings for all 4 ESP32-C3 SuperMini Wheel Nodes
; ----------------------------------------------------------------------------
[wheel_base]
extends = esp_base
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
build_src_filter = +<wheel_node/> -<central_hub/>
build_flags =
    ${esp_base.build_flags}
    -D TECHBIT_ROLE_WHEEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Uncomment below if optional NTC temperature divider is wired to GPIO4:
    ; -D ENABLE_NTC_TEMP=1

; Flash each wheel node with its matching corner ID (0..3)
[env:wheel_fl]
extends = wheel_base
build_flags =
    ${wheel_base.build_flags}
    -D WHEEL_NODE_ID=0

[env:wheel_fr]
extends = wheel_base
build_flags =
    ${wheel_base.build_flags}
    -D WHEEL_NODE_ID=1

[env:wheel_rl]
extends = wheel_base
build_flags =
    ${wheel_base.build_flags}
    -D WHEEL_NODE_ID=2

[env:wheel_rr]
extends = wheel_base
build_flags =
    ${wheel_base.build_flags}
    -D WHEEL_NODE_ID=3

; ----------------------------------------------------------------------------
; Central Analytics & ML Hub (ESP32-S3)
; ----------------------------------------------------------------------------
[env:central_hub]
extends = esp_base
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
build_src_filter = +<central_hub/> -<wheel_node/>
build_flags =
    ${esp_base.build_flags}
    -D TECHBIT_ROLE_CENTRAL=1

; ----------------------------------------------------------------------------
; Native Host Unit Tests (DSP / Fourier FFT / CAN Protocol / TinyML)
; Run via: pio test -e native_test
; ----------------------------------------------------------------------------
[env:native_test]
platform = native
lib_compat_mode = off
lib_ldf_mode = deep+
lib_deps =
    TechBitDSP
    TechBitML
build_src_filter = -<*>
lib_ignore = TechBitCAN
build_flags =
    ${env.build_flags}
    -Iinclude
